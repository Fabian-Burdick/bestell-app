<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bestellapp</title>
    <link rel="icon" href="./assets/icons/takeout_dining_2-default.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/basket.css">
</head>

<body onload="">
    <header>
        <div>
            <a href="/bestell-app">
                <img src="./assets/icons/Logo 02.png" alt="bestellapp">
            </a>
            <img src="./assets/icons/dehaze.png" alt="menu">
        </div>
    </header>
    <section class="hero-section">
        <div>
            <img class="hero-img" src="./assets/img/hero.jpg" alt="hero">
        </div>
        <div class="burgerlogo-background">
            <img class="burgerlogo-img" src="./assets/img/burger-logo.png" alt="burgerlogo">
        </div>
        <div class="hero-text-container">
            <div class="hero-text">
                <h1>Burger</h1>
                <h2>House</h2>
            </div>
            <div class="rate-button">
                <div>
                    <p class="rate-button-star">★</p>
                    <p class="rate-button-text1">4,1</p>
                    <p class="rate-button-text2">(317)</p>
                </div>
            </div>
        </div>
        <div>
            <h3>The best of Burgers, Pizza, and Greens, all in one great place.</h3>
        </div>
    </section>
    <main>
        <section class="headline-section">
            <div class="food-text">
                <img src="./assets/icons/Chanese 1.png" alt="Burger">
                <h4>Burger & Sandwiches</h4>
            </div>
        </section>
        <section class="menu-section" id="burger-content">
        </section>

        <section class="headline-section">
            <div class="food-text pizza">
                <img src="./assets/icons/Pizza 1.png" alt="Pizza">
                <h4>Pizza</h4>
                <h5>(30cm)</h5>
            </div>
        </section>
        <section class="menu-section" id="pizza-content">
        </section>

        <section class="headline-section">
            <div class="food-text salad">
                <img src="./assets/icons/Salad 1.png" alt="Salad">
                <h4>Salad</h4>
            </div>
        </section>
        <section class="menu-section" id="salad-content">
        </section>
    </main>
    <footer>
        <p>© 2025 BurgerHouse</p>
        <p>imprint</p>
        <p>Cookie Preferences</p>
    </footer>
</body>



<script src="./scripts/db.js"></script>
<script src="./script.js"></script>
<script src="./scripts/tamplate.js"></script>

</html>
